name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --org com.nearchat --project-name nearchat app
      - run: |
          cp main.dart app/lib/main.dart
          cd app
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/><application|' android/app/src/main/AndroidManifest.xml
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: nearchat-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
